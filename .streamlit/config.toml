# Общие настройки интерфейса. Секреты здесь не хранятся.
[browser]
# Исследовательский инструмент работает с личной перепиской:
# телеметрию отключаем.
gatherUsageStats = false

[server]
# Архивы импортируются файлами до 100 МБ (ограничение проверяется в коде).
maxUploadSize = 120
# Без этого Streamlit при первом запуске требует email в консоли и не стартует.
# Браузер открывает start.py.
headless = true

[theme]
base = "dark"
# Приглушённый сине-серый фон: длительное чтение протоколов экспериментов
# без резкого контраста.
backgroundColor = "#13161c"
secondaryBackgroundColor = "#1c212b"
textColor = "#dfe3ea"
primaryColor = "#6ea8fe"
